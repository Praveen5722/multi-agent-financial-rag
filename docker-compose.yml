services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    volumes:
      - ./backend/data:/app/data
  frontend:
    image: node:20-alpine
    working_dir: /workspace
    volumes:
      - ./frontend:/workspace
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on: [backend]
